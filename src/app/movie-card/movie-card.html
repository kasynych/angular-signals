<div class="flex gap-5 hover:bg-violet-100 p-1">
  <div routerLink="/movie/{{movie.id}}" class="cursor-pointer min-w-30">
    <img class="h-40" src="https://image.tmdb.org/t/p/w500{{movie.poster_path}}" />
  </div>
  <div>
    <a routerLink="/movie/{{movie.id}}" class="text-3xl">{{movie.title}}</a>
    <p class="pb-2">{{movie.overview | excerpt}}</p>
    <p>Rating: {{movie.vote_average}}/10</p>
    <p>Released: {{movie.release_date | date: 'mediumDate'}}</p>
  </div>
</div>
