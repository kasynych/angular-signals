<div class="flex justify-end">
  <mat-form-field class="example-form-field">
  <mat-label>Filter</mat-label>
  <input matInput type="text" [(ngModel)]="filterValue" (keyup)="onFilterValueChange($event)">
  @if (filterValue()) {
    <button matSuffix matIconButton aria-label="Clear" (click)="onClearFilterClick()">
      <mat-icon>close</mat-icon>
    </button>
  }
</mat-form-field>
</div>
@if (status() === 'loading') {
  <app-loading />
} @else if (status() === 'error') {
  <app-error />
} @else if (status() === 'loaded') {
  @if(!movies()?.results || !movies()?.results.length) {
    <app-no-results />
  } @else {
<div class="flex flex-col gap-5">
    @for (movie of movies()?.results; track movie.id) {
      <app-movie-card [movie]="movie" />
    }
  </div>
  <div [hidden]="!movies()?.total_results || movies()?.total_results <= 20">
    <mat-paginator
      [length]="movies()?.total_results"
      [pageSize]="20"
      (page)="handlePageEvent($event)"
    >
    </mat-paginator>
  </div>
  }
}
